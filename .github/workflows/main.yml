name: Main

on:
  push:
    branches: [master]
  pull_request: ~

env:
  FORCE_COLOR: 1

jobs:
  pre-commit:
    name: Run pre-commit checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Cache pre-commit environment
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
  phpstan:
    name: Run PHPStan
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
    - name: Install dependencies
      run: composer install --prefer-dist -d tasmoadmin/
    - name: Run PHPStan
      run: |
        cd tasmoadmin
        ./vendor/bin/phpstan
  php-cs-fixer:
    name: Run php-cs-fixer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - name: Install dependencies
        run: composer install --prefer-dist -d tasmoadmin/
      - name: Run php-cs-fixer
        run: |
          cd tasmoadmin
          ./vendor/bin/php-cs-fixer fix --dry-run
  php-tests:
    name: Run PHP tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version: ['8.5', '8.4', '8.3', '8.2']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: tasmoadmin_test
          MARIADB_USER: tasmo
          MARIADB_PASSWORD: tasmo
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tasmoadmin_test
          POSTGRES_USER: tasmo
          POSTGRES_PASSWORD: tasmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tasmo"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TASMO_TEST_DB_URIS: mysql://tasmo:tasmo@127.0.0.1:3306/tasmoadmin_test,postgres://tasmo:tasmo@127.0.0.1:5432/tasmoadmin_test
    steps:
    - uses: actions/checkout@v6
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: pdo_sqlite, pdo_mysql, pdo_pgsql
    - name: Install dependencies
      run: composer install --prefer-dist -d tasmoadmin/
    - name: Run tests
      run: |
        cd tasmoadmin
        XDEBUG_MODE=coverage ./vendor/bin/phpunit --coverage-clover coverage.xml --display-deprecations
    - uses: codecov/codecov-action@v7
      if: matrix.php-version == '8.4'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./tasmoadmin/coverage.xml
  npm-build:
    name: Run npm build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'tasmoadmin/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'tasmoadmin/'
      - name: Install dependencies
        run: |
          cd tasmoadmin
          npm ci
      - name: Build assets
        run: |
          cd tasmoadmin
          npm run build
  js-tests:
    name: Run JS tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'tasmoadmin/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'tasmoadmin/'
      - name: Install dependencies
        run: |
          cd tasmoadmin
          npm ci
      - name: Run JS tests
        run: |
          cd tasmoadmin
          npm run test:js
  prettier-check:
    name: Run prettier:check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'tasmoadmin/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'tasmoadmin/'
      - name: Install dependencies
        run: |
          cd tasmoadmin
          npm ci
      - name: Run prettier:check
        run: |
          cd tasmoadmin
          npm run prettier:check

  docker-test:
    name: Run Docker tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch:
          - amd64
          - arm
          - arm64
    env:
      BUILD_REF: ${{ github.sha }}
      BUILD_VERSION: ${{ github.ref_name }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64,arm
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build docker images
      run: ./.docker/docker.sh build_${{ matrix.arch }}
    - name: Test docker images
      run: ./.docker/docker.sh test_${{ matrix.arch }}
