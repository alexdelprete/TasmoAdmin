name: Fork image

on:
  push:
    branches:
      - alex/fixes
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/alexdelprete/tasmoadmin
  IMAGE_TAG: v5.1.0-beta.4-fixes

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64 image
        run: |
          docker buildx build --progress=plain --push --platform linux/amd64 \
            --build-arg BUILD_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg BUILD_VERSION="${IMAGE_TAG}" \
            --build-arg BUILD_FROM=amd64/alpine:3.24 \
            --build-arg BUILD_ARCH=amd64 \
            --file ./.docker/Dockerfile.alpine-tmpl \
            --tag "${IMAGE}:${IMAGE_TAG}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA::7}" \
            .
